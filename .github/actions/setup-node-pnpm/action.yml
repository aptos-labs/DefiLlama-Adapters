name: Setup Node.js with pnpm
description: >
  Composite action: install pnpm, setup Node.js 20,
  run Aikido safe-chain supply-chain check, and install dependencies.
  Requires actions/checkout to have already run in the calling job.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 10
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: 'pnpm'

    - uses: aptos-labs/actions/aikidosec-safe-chain@main

    - name: Install dependencies
      run: pnpm install
      shell: bash
